<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 300" font-family="Consolas,Menlo,monospace" role="img" aria-label="Scaled dot-product attention dataflow: Q,K,V through QK-transpose, scale, softmax, and PV to output O">
  <defs>
    <marker id="arw" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 z" fill="#7bd0ff"/>
    </marker>
    <style>
      .card{fill:#141b2d;stroke:#2e3b57;stroke-width:1.5;rx:8;}
      .op{fill:#182642;stroke:#3d6ea5;stroke-width:1.5;}
      .lbl{fill:#e6edf6;font-size:18px;font-weight:700;}
      .sub{fill:#8fa3c0;font-size:12px;}
      .flow{stroke:#7bd0ff;stroke-width:2;fill:none;marker-end:url(#arw);}
      .eq{fill:#7bd0ff;font-size:13px;}
    </style>
  </defs>
  <rect x="0" y="0" width="920" height="300" fill="#0b0f1a" rx="12"/>

  <!-- inputs -->
  <rect class="card" x="24" y="40" width="90" height="50" rx="8"/>
  <text class="lbl" x="69" y="66" text-anchor="middle">Q</text>
  <text class="sub" x="69" y="82" text-anchor="middle">4x4 queries</text>

  <rect class="card" x="24" y="125" width="90" height="50" rx="8"/>
  <text class="lbl" x="69" y="151" text-anchor="middle">K</text>
  <text class="sub" x="69" y="167" text-anchor="middle">4x4 keys</text>

  <rect class="card" x="24" y="210" width="90" height="50" rx="8"/>
  <text class="lbl" x="69" y="236" text-anchor="middle">V</text>
  <text class="sub" x="69" y="252" text-anchor="middle">4x4 values</text>

  <!-- QK^T / scale -->
  <rect class="op" x="185" y="82" width="140" height="66" rx="8"/>
  <text class="lbl" x="255" y="110" text-anchor="middle" font-size="16">QK&#8868; / &#8730;d</text>
  <text class="sub" x="255" y="130" text-anchor="middle">scores S (4x4)</text>

  <!-- softmax -->
  <rect class="op" x="395" y="82" width="140" height="66" rx="8"/>
  <text class="lbl" x="465" y="110" text-anchor="middle" font-size="16">softmax</text>
  <text class="sub" x="465" y="130" text-anchor="middle">P = rows sum to 1</text>

  <!-- PV -->
  <rect class="op" x="605" y="125" width="140" height="66" rx="8"/>
  <text class="lbl" x="675" y="153" text-anchor="middle" font-size="16">P &#215; V</text>
  <text class="sub" x="675" y="173" text-anchor="middle">weighted blend</text>

  <!-- output -->
  <rect class="card" x="810" y="128" width="86" height="60" rx="8"/>
  <text class="lbl" x="853" y="158" text-anchor="middle">O</text>
  <text class="sub" x="853" y="176" text-anchor="middle">output</text>

  <!-- flows -->
  <path class="flow" d="M114,65 L180,105"/>
  <path class="flow" d="M114,150 L180,125"/>
  <path class="flow" d="M325,115 L390,115"/>
  <path class="flow" d="M535,115 L600,150"/>
  <path class="flow" d="M114,235 C150,235 160,158 600,158"/>
  <path class="flow" d="M745,158 L806,158"/>

  <!-- equations footer -->
  <text class="eq" x="24" y="292">S = QK&#8868; / &#8730;d      P = softmax(S)      O = PV</text>
</svg>
